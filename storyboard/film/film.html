<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>VOOM PropTech Summit Reel</title>

<script src="gsap.min.js"></script>
<style>
/* 1080x1920 Reel film. Every frame is a pure function of time: window.seek(t). */
:root{--deep:#000024;--blue:#0012d6;--light:#00b3ff;--off:#f1f1f1;--mute:#b9c6f2;--sky1:#eaf7ff;--sky2:#7fd0ff;
  --ar:"thmanyah sans",sans-serif;--lat:"Gabarito",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;width:1080px;height:1920px;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--deep)}
.scene{position:absolute;inset:0;overflow:hidden;visibility:hidden}
.cam{position:absolute;inset:0;transform-origin:50% 50%}
.abs{position:absolute}
.plate{position:absolute;inset:0;width:1080px;height:1920px}
.L{position:absolute;display:block}
.w{position:absolute}
.w .wi{position:absolute;inset:0;width:100%;height:100%}
.w .g{position:absolute;inset:0;-webkit-mask-size:100% 100%;mask-size:100% 100%;opacity:0}
.tw{display:inline-block;position:relative;white-space:nowrap}
.tw .wi{display:inline-block}
.tw .g{position:absolute;left:0;top:0;opacity:0;background:none!important;-webkit-text-fill-color:currentColor;white-space:nowrap}
.grad{background:linear-gradient(180deg,var(--sky1) 10%,var(--sky2) 95%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-block:.12em .3em;margin-block:-.12em -.3em}
.ar{font-family:var(--ar);direction:rtl}
.lat{font-family:var(--lat);direction:ltr;letter-spacing:-.03em}
.line{position:absolute;white-space:nowrap}
.card{background:linear-gradient(180deg,rgba(241,241,241,.10),rgba(241,241,241,.03));border:1.5px solid rgba(127,208,255,.35);border-radius:32px;box-shadow:0 30px 80px rgba(0,0,36,.55)}
#sweep{position:absolute;inset:-200px;pointer-events:none;z-index:50;opacity:0;
  background:linear-gradient(115deg,transparent 28%,rgba(0,18,214,.25) 38%,rgba(0,179,255,.38) 46%,rgba(234,247,255,.42) 50%,rgba(0,179,255,.38) 54%,rgba(0,18,214,.25) 62%,transparent 72%);mix-blend-mode:screen;filter:blur(18px)}
.count{position:absolute;font-family:var(--lat);font-variant-numeric:tabular-nums;white-space:nowrap}
</style>
</head>
<body>
<div id="stage"><div id="sweep"></div></div>
<script>
const MAN = __MANIFEST__;
const W = 1080, H = 1920, FPS = 30;
const stage = document.getElementById('stage');
const tl = gsap.timeline({ paused: true });
const LAUNCH = [.16, 1, .3, 1], ECHO = [.587, .005, .447, .997];
function bez(x1, y1, x2, y2) { const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  const X = t => ((ax * t + bx) * t + cx) * t, Y = t => ((ay * t + by) * t + cy) * t, D = t => (3 * ax * t + 2 * bx) * t + cx;
  return p => { if (p <= 0) return 0; if (p >= 1) return 1; let t = p; for (let i = 0; i < 8; i++) { const e = X(t) - p, d = D(t); if (Math.abs(e) < 1e-5 || Math.abs(d) < 1e-6) break; t -= e / d; } return Y(t); }; }
const eLaunch = bez(...LAUNCH), eEcho = bez(...ECHO), eSettle = bez(.22, 1, .36, 1), eGlide = bez(.45, 0, .15, 1), eExit = bez(.55, 0, 1, .45);
const backOut = p => { const s = 1.25; p -= 1; return p * p * ((s + 1) * p + s) + 1; };
const el = (tag, cls, parent, css) => { const e = document.createElement(tag); if (cls) e.className = cls; if (css) Object.assign(e.style, css); if (parent) parent.appendChild(e); return e; };

// ---------------- text effect (Text Studio settings: echo + blur, ghosts lead the word, tint from the echo colour)
const TFX = { distance: 60, duration: .6, blur: 14, echo: '#00b3ff', ghosts: 2, ghostGap: 1, ghostOpacity: .25, echoBlur: 18, lead: 4, glow: .35, glowStay: .12 };
function ghostFor(w, color) {
  const g = el('div', 'g', w);
  if (w.dataset.src) { g.style.background = color; g.style.webkitMaskImage = g.style.maskImage = `url(${w.dataset.src})`; }
  else { g.textContent = w.querySelector('.wi').textContent; g.style.color = color; g.className = 'g ' + (w.dataset.cls || ''); g.style.background = 'none'; g.style.webkitTextFillColor = color; }
  return g;
}
function echoIn(words, t0, opt = {}) {
  const o = Object.assign({}, TFX, opt), dir = o.dir || 'right';
  const [dx, dy] = { right: [o.distance, 0], left: [-o.distance, 0], up: [0, -o.distance * .7], down: [0, o.distance * .7] }[dir];
  words.forEach((w, i) => {
    const t = t0 + i * (o.stagger ?? .09), wi = w.querySelector('.wi');
    const glow = ghostFor(w, o.echo); glow.style.zIndex = -1;
    tl.fromTo(glow, { opacity: 0, x: dx, y: dy, filter: 'blur(18px)' }, { opacity: o.glow, x: 0, y: 0, duration: o.duration, ease: eEcho }, t - o.lead / FPS);
    tl.to(glow, { opacity: o.glowStay, duration: o.duration * 1.2, ease: 'sine.out' }, t + o.duration);
    tl.to(glow, { opacity: 0, duration: .6 }, t + o.duration * 2.4);
    for (let k = 1; k <= o.ghosts; k++) {
      const gh = ghostFor(w, o.echo), op = o.ghostOpacity * (1 - (k - 1) / (o.ghosts + 1)), ts = t - o.lead / FPS - (o.ghosts - k) * o.ghostGap / FPS;
      tl.fromTo(gh, { opacity: 0, x: dx, y: dy, filter: `blur(${o.echoBlur}px)` }, { opacity: op, x: 0, y: 0, filter: `blur(${o.echoBlur * .4}px)`, duration: o.duration * .8, ease: eEcho }, ts);
      tl.to(gh, { opacity: 0, duration: o.duration * .5, ease: 'power1.out' }, t + o.duration * .55);
    }
    tl.fromTo(wi, { opacity: 0, x: dx, y: dy, filter: `blur(${o.blur}px)` }, { opacity: 1, x: 0, y: 0, filter: 'blur(0px)', duration: o.duration, ease: eLaunch }, t);
    const tint = ghostFor(w, o.echo);
    tl.fromTo(tint, { opacity: 0, x: dx, y: dy }, { opacity: 1, x: 0, y: 0, duration: o.duration, ease: eLaunch }, t);
    tl.to(tint, { opacity: 0, duration: o.duration * 1.1, ease: 'power1.inOut' }, t + o.duration * .3);
  });
  return t0 + (words.length - 1) * (o.stagger ?? .09) + o.duration;
}
// sprite words from the manifest
function spriteWords(parent, L) {
  const list = (L.words && L.words.length) ? L.words : [L];
  return list.map(w => { const d = el('div', 'w', parent, { left: w.x + 'px', top: w.y + 'px', width: w.w + 'px', height: w.h + 'px' }); d.dataset.src = w.src;
    const im = el('img', 'wi', d); im.src = w.src; return d; });
}
function sprite(parent, L, css) { const d = el('div', 'w', parent, Object.assign({ left: L.x + 'px', top: L.y + 'px', width: L.w + 'px', height: L.h + 'px' }, css || {})); d.dataset.src = L.src; const im = el('img', 'wi', d); im.src = L.src; return d; }
// live text words (thmanyah / gabarito): line element filled with word spans
function liveLine(parent, text, cls, css, rtl = true) {
  const line = el('div', 'line ' + cls, parent, css);
  const parts = text.split(' '); const words = [];
  parts.forEach((p, i) => { const w = el('span', 'tw', line); w.dataset.cls = cls; const wi = el('span', 'wi', w); wi.textContent = p;
    if (i < parts.length - 1) line.appendChild(document.createTextNode(' ')); words.push(w); });
  return { line, words };
}
const findL = (sc, id) => sc.layers.find(l => l.id === id);

// ---------------- scenes
const SC = []; let T = 0;
function scene(dur, build) { const s = el('div', 'scene', stage); const cam = el('div', 'cam', s); const t0 = T; SC.push({ s, cam, t0, dur }); build(cam, t0, s); T += dur; return s; }
function plate(cam, src) { const p = el('img', 'plate', cam); p.src = src; return p; }
function camPush(cam, t0, dur, from = 1, to = 1.045, extra = {}) { tl.fromTo(cam, Object.assign({ scale: from }, extra.from || {}), Object.assign({ scale: to, duration: dur + .6, ease: 'sine.inOut' }, extra.to || {}), t0 - .3); }
function riseIn(e, t, dist = 140, dur = 1.2) { tl.fromTo(e, { y: dist, opacity: 0, filter: 'blur(14px)' }, { y: 0, opacity: 1, filter: 'blur(0px)', duration: dur, ease: eLaunch }, t); }
function popIn(e, t, from = .5, dur = .55, origin) { if (origin) e.style.transformOrigin = origin; tl.fromTo(e, { scale: from, opacity: 0, filter: 'blur(8px)' }, { scale: 1, opacity: 1, filter: 'blur(0px)', duration: dur, ease: backOut }, t); }
function fadeIn(e, t, dur = .6) { tl.fromTo(e, { opacity: 0 }, { opacity: 1, duration: dur, ease: eSettle }, t); }
function bottomFade(e, pageBottom, topY, len = 240) { const h = parseFloat(e.style.height); const cut = (pageBottom - topY) / h * 100, st = (pageBottom - len - topY) / h * 100;
  e.style.webkitMaskImage = e.style.maskImage = `linear-gradient(180deg,#000 ${st}%,transparent ${cut}%)`; }
function countUp(node, t, target, { dur = .75, fmt = v => Math.round(v).toLocaleString('en-US'), rise = 14, blur = 14 } = {}) {
  const box = { v: 0 }; node.textContent = fmt(0);
  tl.fromTo(node, { opacity: 0, y: rise, filter: `blur(${blur}px)` }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: dur, ease: bez(.33, 0, .67, 1) }, t);
  tl.fromTo(box, { v: 0 }, { v: target, duration: dur, ease: bez(.33, 0, .67, 1), onUpdate: () => { node.textContent = fmt(box.v); } }, t);
  SFX.push(['tick', t, dur]);
}
const SFX = [];   // [type, time, extra] for the sound design pass
const sfx = (type, t, x) => SFX.push([type, +t.toFixed(3), x || 0]);

// ===== S1 hook: hand behind fluted glass (canvas), screen window, question
let hookCanvas, hookCtx, hookImgs = {};
scene(3.4, (cam, t0) => {
  hookCanvas = el('canvas', 'plate', cam); hookCanvas.width = W; hookCanvas.height = H; hookCtx = hookCanvas.getContext('2d');
  for (const k of ['hand_bw', 'hand_glow']) { const im = new Image(); im.src = `assets/own/${k}.jpg`; hookImgs[k] = im; }
  const fx = new Image(); fx.src = 'assets/own/glass_fx.png'; hookImgs.fx = fx;
  const win = el('div', 'abs', cam, { left: '64px', top: '300px', width: '952px', height: '1270px', border: '2px solid rgba(241,241,241,.55)', borderRadius: '30px' });
  const dots = [34, 60, 86].map(x => el('i', 'abs', win, { left: x + 'px', top: '30px', width: '14px', height: '14px', borderRadius: '50%', border: '2px solid rgba(241,241,241,.75)' }));
  const ast = el('div', 'abs', win, { right: '30px', top: '22px', width: '34px', height: '34px' });
  ast.innerHTML = '<svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#00b3ff" stroke-width="2.4" stroke-linecap="round"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/></svg>';
  const q = el('div', 'abs ar', cam, { right: '116px', top: '1160px', textAlign: 'right', fontSize: '80px', fontWeight: 500, lineHeight: 1.24, color: '#f1f1f1' });
  const lines = ['هل يمكن أن تُدار', 'شركتك العقارية كلها', 'من مكان واحد؟'].map((s, i) => { const d = el('div', '', q); const r = liveLine(d, s, 'ar' + (i === 2 ? ' acc' : ''), { position: 'relative' });
    if (i === 2) r.line.style.color = '#00b3ff'; return r; });
  const by = el('div', 'abs lat', cam, { right: '116px', top: '1478px', font: '500 28px Gabarito', color: '#f1f1f1', opacity: .85, letterSpacing: '-.01em' }); by.textContent = 'Powered by VOOM.';
  // window draws in, dots + asterisk pop, text echoes in line by line
  tl.fromTo(win, { opacity: 0, scale: .96, clipPath: 'inset(0 0 100% 0 round 30px)' }, { opacity: 1, scale: 1, clipPath: 'inset(0 0 0% 0 round 30px)', duration: 1.0, ease: eLaunch }, t0 + .15);
  dots.forEach((d, i) => popIn(d, t0 + .7 + i * .06, .2, .4));
  popIn(ast, t0 + .8, .2, .5); tl.to(ast, { rotation: 90, duration: 2.6, ease: 'sine.inOut' }, t0 + .8);
  let t = t0 + .55; lines.forEach(r => { echoIn(r.words, t); t += .36; });
  sfx('whoosh_soft', t0 + .15); sfx('shimmer', t0 + 1.4);
  tl.fromTo(by, { opacity: 0, y: 10 }, { opacity: .85, y: 0, duration: .6, ease: eSettle }, t0 + 1.9);
});
function drawHook(t) {
  const c = hookCtx, s = SC[0]; if (!c || !hookImgs.hand_bw.complete) return;
  const lt = Math.max(0, Math.min(1, (t - s.t0) / (s.dur + .4)));
  const e = eGlide(lt); const dx = -36 + 66 * e, dy = 14 - 26 * e, sc = 1 + .025 * e;
  c.fillStyle = '#000024'; c.fillRect(0, 0, W, H);
  const iw = hookImgs.hand_bw.width * sc, ih = hookImgs.hand_bw.height * sc, ox = -50 + dx, oy = -150 + dy;
  c.globalAlpha = Math.min(1, (t - s.t0) / .7);
  c.drawImage(hookImgs.hand_bw, ox, oy, iw, ih);
  // fluted glass: each rib shows a compressed, shifted slice of the glow-toned hand
  const x0 = 470, rib = 52, k = .62;
  for (let x = x0; x < W; x += rib) {
    const srcStart = (x - 30 - ox) / sc, srcW = rib * k / sc;
    const fade = Math.min(1, (x + rib / 2 - x0) / 120);
    c.globalAlpha = Math.min(1, (t - s.t0) / .7) * fade;
    c.drawImage(hookImgs.hand_glow, srcStart, 0, srcW, hookImgs.hand_glow.height, x, oy, rib, ih);
  }
  const breathe = .75 + .25 * Math.sin((t - s.t0) * 2.2);
  c.globalCompositeOperation = 'screen'; c.globalAlpha = Math.min(1, (t - s.t0) / .7);
  const gr = c.createRadialGradient(760 + dx * .5, 880 + dy, 0, 760 + dx * .5, 880 + dy, 330);
  gr.addColorStop(0, `rgba(0,179,255,${.32 * breathe})`); gr.addColorStop(1, 'rgba(0,179,255,0)'); c.fillStyle = gr; c.fillRect(400, 500, 680, 800);
  if (hookImgs.fx.complete) c.drawImage(hookImgs.fx, 0, 0);
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
}

// ===== S2 cover: logo reveal, headline, wheel pops
scene(4.0, (cam, t0) => {
  const M = MAN.s2; plate(cam, M.plate); camPush(cam, t0, 4.0, 1.0, 1.04);
  const logo = sprite(cam, findL(M, 'logo'));
  tl.fromTo(logo.querySelector('.wi'), { clipPath: 'inset(0 100% 0 0)', opacity: 1 }, { clipPath: 'inset(0 0% 0 0)', duration: .9, ease: eLaunch }, t0 + .2);
  const streak = el('div', 'abs', cam, { left: logo.style.left, top: (parseFloat(logo.style.top) + parseFloat(logo.style.height) * .52) + 'px', width: '160px', height: '6px', borderRadius: '6px',
    background: 'linear-gradient(90deg,transparent,#00b3ff,#eaf7ff,#00b3ff,transparent)', filter: 'blur(1px)', boxShadow: '0 0 30px 8px rgba(0,179,255,.6)' });
  tl.fromTo(streak, { x: -120, opacity: 0 }, { x: parseFloat(logo.style.width), opacity: 1, duration: .9, ease: eLaunch }, t0 + .2); tl.to(streak, { opacity: 0, duration: .3 }, t0 + 1.0);
  sfx('streak', t0 + .2);
  echoIn(spriteWords(cam, findL(M, 't_h1')), t0 + .75);
  echoIn(spriteWords(cam, findL(M, 't_h2')), t0 + 1.15);
  const core = sprite(cam, findL(M, 'core')), cx = M.wheel.cx, cy = M.wheel.cy;
  const setOrigin = (d) => { d.style.transformOrigin = `${cx - parseFloat(d.style.left)}px ${cy - parseFloat(d.style.top)}px`; };
  setOrigin(core); popIn(core, t0 + 1.25, .3, .7); sfx('pop_low', t0 + 1.3);
  const order = [5, 6, 7, 0, 1, 2, 3, 4];   // clockwise from PropTech (top-left)
  order.forEach((k, i) => { const d = sprite(cam, findL(M, 'seg' + k)); setOrigin(d); const t = t0 + 1.55 + i * .085;
    tl.fromTo(d, { scale: .55, opacity: 0, filter: 'blur(10px)' }, { scale: 1, opacity: 1, filter: 'blur(0px)', duration: .6, ease: backOut }, t); sfx('pop', t + .05, i); });
  tl.fromTo(core, { rotation: -8 }, { rotation: 0, duration: 1.6, ease: eSettle }, t0 + 1.25);
  const url = sprite(cam, findL(M, 't_url')); fadeIn(url, t0 + 2.6);
});

// ===== S3 your project: text, tower + man rise, bands come out, labels, Floor 23 card
scene(4.2, (cam, t0) => {
  const M = MAN.s3; plate(cam, M.plate); camPush(cam, t0, 4.2, 1.03, 1.0);
  echoIn(spriteWords(cam, findL(M, 't_eyebrow')), t0 + .15, { dir: 'up' });
  echoIn(spriteWords(cam, findL(M, 't_h1')), t0 + .45);
  echoIn(spriteWords(cam, findL(M, 't_h2')), t0 + .8);
  const bands = [1, 2, 3].map(i => { const d = sprite(cam, findL(M, 'band' + i)); d.style.transformOrigin = '36% 50%'; return d; });
  const fg = sprite(cam, findL(M, 'fg')); bottomFade(fg, M.pageBottom, parseFloat(fg.style.top), 200);
  const card = sprite(cam, findL(M, 'card'));
  riseIn(fg, t0 + .35, 170, 1.4); sfx('rise', t0 + .35);
  bands.forEach((b, i) => { tl.fromTo(b, { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: .8, ease: eLaunch }, t0 + 1.15 + i * .12); sfx('swish', t0 + 1.15 + i * .12, i); });
  ['t_l1', 't_l2', 't_l3'].forEach((id, i) => echoIn(spriteWords(cam, findL(M, id)), t0 + 1.5 + i * .14, { dir: 'left' }));
  ['t_r1', 't_r2', 't_r3'].forEach((id, i) => echoIn(spriteWords(cam, findL(M, id)), t0 + 1.55 + i * .14));
  card.style.transformOrigin = '100% 0%'; popIn(card, t0 + 2.0, .2, .6); sfx('pop', t0 + 2.05, 3);
  cam.appendChild(card);
});

// ===== S4 it looks like Voom: text then the dashboard pastes in from below, KPIs count
scene(4.0, (cam, t0) => {
  el('div', 'abs', cam, { inset: 0, background: 'radial-gradient(90% 55% at 70% 18%,rgba(0,18,214,.75),transparent 70%),radial-gradient(120% 70% at 30% 100%,rgba(0,18,214,.9),transparent 70%),#000024' });
  camPush(cam, t0, 4.0, 1.0, 1.035);
  const q1 = liveLine(cam, 'What does smarter', 'lat', { left: '72px', top: '340px', font: '500 54px/1.1 Gabarito', color: '#f1f1f1' });
  const q2 = liveLine(cam, 'selling look like?', 'lat', { left: '72px', top: '400px', font: '500 54px/1.1 Gabarito', color: '#f1f1f1' });
  const h1 = liveLine(cam, 'It looks', 'lat', { left: '72px', top: '480px', font: '700 172px/.92 Gabarito', color: '#f1f1f1' });
  const h2 = el('div', 'line lat', cam, { left: '72px', top: '638px', font: '700 172px/.92 Gabarito', color: '#f1f1f1' });
  const w1 = el('span', 'tw', h2); el('span', 'wi', w1).textContent = 'like'; h2.appendChild(document.createTextNode(' '));
  const w2 = el('span', 'tw', h2); w2.dataset.cls = 'grad'; const wi2 = el('span', 'wi grad', w2); wi2.textContent = 'Voom';
  const a1 = liveLine(cam, 'كل تفصيلة في مشروعك تتحول', 'ar', { right: '72px', top: '820px', fontSize: '44px', fontWeight: 500, color: '#f1f1f1' });
  const a2 = liveLine(cam, 'لجزء من تجربة البيع مع Voom', 'ar', { right: '72px', top: '880px', fontSize: '44px', fontWeight: 500, color: '#f1f1f1' });
  const c1 = liveLine(cam, 'Full Control. Clear Insights. One Dashboard.', 'lat', { left: '72px', top: '975px', font: '600 40px Gabarito', color: '#f1f1f1' });
  const c2 = liveLine(cam, 'حلّل بيانات مشاريعك، تابع الأداء، واتخذ قرارات أفضل', 'ar', { left: '72px', top: '1032px', fontSize: '34px', fontWeight: 500, color: '#7fd0ff' });
  echoIn(q1.words, t0 + .1, { dir: 'up' }); echoIn(q2.words, t0 + .3, { dir: 'up' });
  echoIn(h1.words, t0 + .55, { dir: 'left' }); echoIn([w1, w2], t0 + .8, { dir: 'left' });
  echoIn(a1.words, t0 + 1.15, { stagger: .06 }); echoIn(a2.words, t0 + 1.3, { stagger: .06 });
  echoIn(c1.words, t0 + 1.45, { dir: 'left', stagger: .06 }); echoIn(c2.words, t0 + 1.6, { stagger: .05 });
  const dash = el('div', 'abs card', cam, { left: '72px', top: '1110px', width: '936px', padding: '18px' });
  const img = el('img', '', dash, { display: 'block', width: '100%', borderRadius: '18px' }); img.src = 'assets/own/dash.jpg';
  tl.fromTo(dash, { y: 260, opacity: 0, scale: .94, filter: 'blur(16px)' }, { y: 0, opacity: 1, scale: 1, filter: 'blur(0px)', duration: 1.2, ease: eLaunch }, t0 + 1.55);
  sfx('whoosh_up', t0 + 1.55);
  const k = 900 / 1120, OX = 18, OY = 18;
  const nums = [[302, 128, 365, 147, '#1a00ff', '#ffffff', 3420], [188, 321, 240, 338, '#fbfbfb', '#0a0a1e', 1245], [401, 321, 444, 338, '#fbfbfb', '#0a0a1e', 52, '%'],
    [606, 321, 648, 338, '#fbfbfb', '#0a0a1e', 68, '%'], [831, 321, 853, 338, '#fbfbfb', '#0a0a1e', 18], [1008, 321, 1058, 338, '#fbfbfb', '#0a0a1e', 4820]];
  nums.forEach(([x0, y0, x1, y1, bg, fg, target, suf], i) => {
    const patch = el('div', 'abs', dash, { left: (OX + (x0 - 4) * k) + 'px', top: (OY + (y0 - 3) * k) + 'px', width: ((x1 - x0 + 8) * k) + 'px', height: ((y1 - y0 + 6) * k) + 'px', background: bg });

// ---------------- scene visibility + transitions (soft blur dissolve with a light sweep)
const TOTAL = T;
SC.forEach((c, i) => {
  const inT = i ? c.t0 - .25 : 0, outT = i < SC.length - 1 ? c.t0 + c.dur - .25 : TOTAL + 1;
  tl.set(c.s, { visibility: 'visible' }, inT); tl.set(c.s, { visibility: 'hidden' }, outT + .5);
  if (i) tl.fromTo(c.s, { opacity: 0, filter: 'blur(10px)', scale: .985 }, { opacity: 1, filter: 'blur(0px)', scale: 1, duration: .5, ease: eSettle }, inT);
  if (i < SC.length - 1) { tl.to(c.s, { opacity: 0, filter: 'blur(10px)', scale: 1.03, duration: .5, ease: eExit }, outT); sfx('whoosh', outT); }
});
const sweep = document.getElementById('sweep');
SC.forEach((c, i) => { if (!i) return; const t = c.t0 - .35; tl.fromTo(sweep, { opacity: 0, x: -900 }, { opacity: 1, x: 0, duration: .35, ease: 'power1.in' }, t); tl.to(sweep, { opacity: 0, x: 900, duration: .35, ease: 'power1.out' }, t + .35); });
tl.set({}, {}, TOTAL);
window.TOTAL = TOTAL; window.SFX = SFX; window.SCENES = SC.map(c => [c.t0, c.dur]);
window.seek = t => { tl.time(Math.min(t, TOTAL - 1e-3)); drawHook(t); };
const imgs = [...document.images];
window.ready = Promise.all([document.fonts.ready, ...imgs.map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; })), ...Object.values(hookImgs).map(i => i.complete ? 1 : new Promise(r => { i.onload = i.onerror = r; }))]);
window.ready.then(() => { document.body.dataset.ready = '1'; const p = new URLSearchParams(location.search); window.seek(+(p.get('t') || 0)); });
</script>
